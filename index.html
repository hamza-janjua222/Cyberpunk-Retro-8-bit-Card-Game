<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Retro Memory Game</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />

    <!-- Split CSS files -->
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/game.css" />
  </head>
  <body>
    <!-- Video Background -->
    <video autoplay muted loop playsinline id="bg-video">
      <source src="gamu.mp4" type="video/mp4" />
    </video>
    <div id="bg-overlay"></div>
    <!-- Main App Container -->
    <div id="app">
      <h1 id="game-title">MEMORY MATCH</h1>
      <!-- Heads-Up Display (HUD) for timer and move count, with ARIA attributes for accessibility. -->
      <div id="hud">
        <div id="timer-container">
          <span class="hud-label">TIME</span>
          <span id="timer-display" aria-live="off">00:00</span>
        </div>
        <!-- Move counter with ARIA live region to announce changes to screen readers. -->
        <div id="moves-container">
          <span class="hud-label">MOVES</span>
          <span id="moves-count" aria-live="polite">0</span>
        </div>
      </div>

      <main id="game-board" aria-label="Memory card game board">
        <!-- Cards are dynamically generated by script.js -->
      </main>
      <!-- Modal dialog for win condition, hidden by default and shown when the player wins. Uses ARIA roles for accessibility. -->
      <div
        id="win-modal"
        role="alertdialog"
        aria-labelledby="win-title"
        aria-hidden="true"
      >
        <div id="win-content">
          <h2 id="win-title">YOU WIN!</h2>
          <p id="win-moves-display">Moves: 0</p>
          <p id="win-time-display">Time: 00:00</p>
          <button id="restart-btn-modal">PLAY AGAIN</button>
        </div>
      </div>
      <!--Restart Control Button -->
      <div id="controls">
        <button id="restart-btn">RESTART</button>
      </div>
      <!-- Confetti Canvas -->
      <canvas id="confetti-canvas" aria-hidden="true"></canvas>
    </div>

    <!-- Split JS files (effects must load before main script) -->
    <script src="js/effects.js" defer></script>
    <script src="js/script.js" defer></script>
  </body>
</html>
